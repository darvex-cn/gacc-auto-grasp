# 自定义配置：嵌套分组由 load_config 展开为 group.parameter。
pose_detect_node:
  # 该节点的通用设置
  general:
    hand_eye_calibration_path: grasp_ws/src/pose_detect/config/hand_eye_calibration.yaml
    robot_pose_topic: /rokae_driver7/tool_pose
    pose_units: m
    base_frame: base_link
  # GraspNet推理参数设置
  graspnet:
    checkpoint_path: models/graspnet/checkpoint-rs.tar
    device: cuda:0
    num_point: 30000
    num_view: 300
    collision_thresh: 0.005
    voxel_size: 0.01
    max_gripper_width: 0.08
    max_grasps: 30
    # 仅在该角度内的俯抓候选中选择相对当前夹爪旋转最小的姿态
    max_approach_angle_deg: 20.0
  # 物体检测参数设置
  object_detect:
    object_model_path: models/yolo/trained/motor_parts_yolo26s_seg/best.pt
    target_class:
      - motor_part_type1
      - motor_part_type2
    selection_policy: highest_confidence # largest_area, highest_confidence
    # 开启时显示全部实例，并用红色突出 selection_policy 选中的目标
    visual_enable: true
    confidence_threshold: 0.85
    iou_threshold: 0.7
    mask_threshold: 0.5
    image_size: 640
    inference_rate: 30.0
    device: cuda:0
    quantize: 16
    retina_masks: false
  # 相机参数设置
  camera:
    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/depth/camera_info
    depth_scale: 1000.0
    max_image_age: 2.0
    # ApproximateTimeSynchronizer 允许的 RGB-D 时间戳差值（秒）
    max_image_time_difference: 0.01
    camera_frame: camera_color_optical_frame
  # RViz显示参数设置
  rviz:
    grasp_visual_enable: true
    rviz_cloud_max_points: 10000
    gripper_line_width: 0.003

# 实时分割模型验证节点
segmentation_test_node:
  object_model_path: models/yolo/trained/motor_parts_yolo26s_seg/best.pt
  target_class:
    - motor_part_type1
    - motor_part_type2
  selection_policy: largest_area
  # 开启时显示全部实例，并用红色突出 selection_policy 选中的目标
  visual_enable: true
  confidence_threshold: 0.25
  iou_threshold: 0.7
  mask_threshold: 0.5
  image_size: 640
  device: cuda:0
  quantize: 16
  retina_masks: false
  rgb_topic: /camera/color/image_raw
  output_topic: /motor_part/segmentation_image
  inference_rate: 30.0
